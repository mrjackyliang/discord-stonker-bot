      TZ: "${TZ:-UTC}"
      WORKER_POLL_INTERVAL_MS: "${WORKER_POLL_INTERVAL_MS:-1000}"
    network_mode: host
    restart: always
    user: "0:0"
    volumes:
      - stonker-data:/config

volumes:
  stonker-data:
